{% extends "base.html" %}

{% block title %}{% if post %}Edit Post{% else %}New Post{% endif %} - CRUD App{% endblock %}

{% block content %}
<h1 style="margin-bottom: 1.5rem;">{% if post %}Edit Post{% else %}New Post{% endif %}</h1>

<div class="card">
    <form method="post" action="{% if post %}/posts/{{ post.id }}/edit{% else %}/new{% endif %}">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ post.author if post else '' }}" required>

        <label for="content">Content</label>
        <textarea id="content" name="content">{{ post.content if post else '' }}</textarea>

        <label for="published">
            <input type="checkbox" id="published" name="published" value="true" {% if post and post.published %}checked{% endif %}>
            Published
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if post %}Update{% else %}Create{% endif %}</button>
            <a href="{% if post %}/posts/{{ post.id }}{% else %}/{% endif %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
